<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Ícone -->
  <rect width="80" height="80" rx="18" fill="url(#bg2)"/>

  <!-- V -->
  <polyline
    points="14,18 40,62 66,18"
    stroke="white"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- + -->
  <line x1="66" y1="7"  x2="66" y2="29" stroke="#E9D5FF" stroke-width="7" stroke-linecap="round"/>
  <line x1="55" y1="18" x2="77" y2="18" stroke="#E9D5FF" stroke-width="7" stroke-linecap="round"/>

  <!-- Wordmark "Venda" -->
  <text
    x="96"
    y="48"
    font-family="'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#5B21B6"
    letter-spacing="-0.5"
  >Venda</text>

  <!-- Wordmark "Mais" em roxo mais vivo -->
  <text
    x="218"
    y="48"
    font-family="'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#7C3AED"
    letter-spacing="-0.5"
  >Mais</text>

  <!-- Linha decorativa abaixo do texto -->
  <rect x="96" y="55" width="234" height="3" rx="2" fill="#7C3AED" opacity="0.18"/>
</svg>
