<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Preview — Logo Venda Mais</title>
  <style>
    body { background: #f1f0f5; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 60px 20px; }
    section { background: white; border-radius: 20px; padding: 40px 48px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 320px; }
    h2 { margin: 0; color: #6b7280; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .dark { background: #1a1023; }
    .dark h2 { color: #a78bfa; }
    .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>

  <section>
    <h2>Ícone do App — fundo claro</h2>
    <div class="row">
      <img src="logo-icon.svg" width="100" height="100" alt="icon 100">
      <img src="logo-icon.svg" width="60" height="60" alt="icon 60">
      <img src="logo-icon.svg" width="40" height="40" alt="icon 40">
      <img src="logo-icon.svg" width="24" height="24" alt="icon 24">
    </div>
  </section>

  <section class="dark">
    <h2>Ícone do App — fundo escuro</h2>
    <div class="row">
      <img src="logo-icon.svg" width="100" height="100" alt="icon dark 100">
      <img src="logo-icon.svg" width="60" height="60" alt="icon dark 60">
      <img src="logo-icon.svg" width="40" height="40" alt="icon dark 40">
    </div>
  </section>

  <section>
    <h2>Logo Completo (horizontal)</h2>
    <img src="logo-full.svg" width="340" height="80" alt="logo full">
    <img src="logo-full.svg" width="200" height="47" alt="logo full small">
  </section>

  <section>
    <h2>Play Store / App Store (512×512)</h2>
    <img src="logo-playstore.svg" width="200" height="200" alt="playstore">
    <img src="logo-playstore.svg" width="100" height="100" alt="playstore small">
  </section>

</body>
</html>
