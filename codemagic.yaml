# Codemagic — gera o app FWC Gestor do iPhone num Mac na nuvem e manda pro
# TestFlight. Não temos Mac: o Xcode só roda lá. O Android continua sendo
# gerado aqui no PC (gestor-app/android).
#
# Antes do primeiro build, no Codemagic:
#   Teams → Integrations → Developer Portal: ligar a chave da App Store Connect
#   API com o nome "FWC ASC" (Issuer ID + Key ID + arquivo .p8).
workflows:
  gestor-ios:
    name: FWC Gestor (iPhone)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FWC ASC
    environment:
      # Grupo "ios_cert" (aba Environment variables do app no Codemagic) traz a
      # CERTIFICATE_PRIVATE_KEY: a chave particular do certificado de
      # distribuição. Com ela o próprio build cria/reaproveita o certificado e o
      # perfil na Apple — a conta é nova e não tinha nenhum ("No matching
      # profiles found" no 1º build). Cópia da chave em keystore/ (fora do git).
      groups:
        - ios_cert
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: cd gestor-app && npm ci
      - name: Sincronizar Capacitor
        script: cd gestor-app && npx cap sync ios
      - name: Assinatura
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.fwcinter.gestor" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project gestor-app/ios/App/App.xcodeproj
      - name: Gerar IPA
        script: |
          xcode-project build-ipa \
            --project gestor-app/ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # App de vendas (cliente): o FWC Inter que já está na Play. Mesma casca que
  # abre app.fwcinter.com ao vivo; o projeto iOS mora na raiz (ios/).
  cliente-ios:
    name: FWC Inter (iPhone)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FWC ASC
    environment:
      groups:
        - ios_cert
      vars:
        PUPPETEER_SKIP_DOWNLOAD: "true"
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Sincronizar Capacitor
        script: |
          # A casca abre o site ao vivo; o webDir só precisa existir pro sync.
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html><title>FWC Inter</title>' > dist/index.html
          npx cap sync ios
      - name: Assinatura
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.fwcinter.app" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Gerar IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
