<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#1e0a3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#e879f9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Shopping bag shape -->
  <g transform="translate(106, 80)">
    <!-- Bag handle -->
    <path d="M100 60 Q100 10 150 10 Q200 10 200 60" stroke="#a78bfa" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Bag body -->
    <rect x="40" y="60" width="220" height="210" rx="24" fill="#2e0a5e" stroke="#a78bfa" stroke-width="3"/>
    <!-- Chart bars inside bag -->
    <rect x="72" y="210" width="30" height="40" rx="6" fill="#7c3aed"/>
    <rect x="115" y="185" width="30" height="65" rx="6" fill="#a78bfa"/>
    <rect x="158" y="155" width="30" height="95" rx="6" fill="url(#accent)"/>
    <!-- Trend line -->
    <polyline points="72,208 115,183 158,153 200,125" stroke="#e879f9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow up -->
    <polygon points="200,112 215,134 185,134" fill="#e879f9"/>
  </g>

  <!-- App name -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" fill="white">Venda</text>
  <text x="380" y="400" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" fill="url(#accent)">+</text>
</svg>
