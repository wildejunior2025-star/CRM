<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#863bff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FWC Inter" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Favicon branco só no domínio do portal (portal.fwcinter.com).
      // Nos outros domínios (gestor, admin, app...) fica o roxo.
      if (location.hostname === 'portal.fwcinter.com') {
        var _ic = document.querySelector('link[rel="icon"]');
        if (_ic) _ic.href = '/favicon-branco.png';
        var _at = document.querySelector('link[rel="apple-touch-icon"]');
        if (_at) _at.href = '/apple-touch-icon-branco.png';
        // Ícone do app INSTALADO (PWA) também branco só no portal: troca o
        // manifesto pro que aponta os pwa-*-branco.png. Nos outros domínios o
        // manifesto padrão (roxo) segue valendo. O link do manifesto é injetado
        // pelo vite-pwa e pode vir depois deste script — então tenta agora e
        // também no DOMContentLoaded pra garantir que já exista.
        var _trocaManifesto = function () {
          var _mf = document.querySelector('link[rel="manifest"]');
          if (_mf) _mf.href = '/manifest-portal.webmanifest';
        };
        _trocaManifesto();
        document.addEventListener('DOMContentLoaded', _trocaManifesto);
      } else if (location.hostname === 'gestor.fwcinter.com') {
        // Gestor: mesmo app, mas o PWA instalado se chama "FWC Gestor" (ícone
        // roxo) pra diferenciar do "FWC Portal" na lista de apps do PC.
        var _trocaManifestoGestor = function () {
          var _mfg = document.querySelector('link[rel="manifest"]');
          if (_mfg) _mfg.href = '/manifest-gestor.webmanifest';
        };
        _trocaManifestoGestor();
        document.addEventListener('DOMContentLoaded', _trocaManifestoGestor);
      }
    </script>
    <title>FWC Inter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var stored = localStorage.getItem('crm-theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ── Socorro pra tela branca depois de uma publicação ─────────────────
      // Cada publicação troca o nome dos arquivos do app. Se o aparelho ainda
      // tem ESTE html guardado pelo PWA, ele pede um arquivo que já não existe:
      // o servidor devolve a página de erro em HTML, o navegador recusa pelo
      // tipo errado e a tela fica BRANCA, sem mensagem nenhuma.
      //
      // Não dá pra resolver lá dentro do app: quando o arquivo principal falha,
      // o app nem chega a começar a rodar. Por isso a proteção mora aqui, solta
      // no HTML, e roda antes de tudo.
      //
      // Ao perceber a falha: joga fora o service worker e os caches, e recarrega.
      // Aí o navegador busca o html novo, com os nomes certos.
      (function () {
        var LIMITE = 'fwc_socorro_recarga'
        window.addEventListener('error', function (e) {
          var alvo = e && e.target
          if (!alvo || alvo.tagName !== 'SCRIPT' || !alvo.src) return

          // Uma vez só a cada 30s. Se o motivo for outro (internet caiu no meio
          // do download), recarregar não resolve e ficaria em laço eterno.
          var agora = Date.now()
          try {
            if (agora - Number(sessionStorage.getItem(LIMITE) || 0) < 30000) return
            sessionStorage.setItem(LIMITE, String(agora))
          } catch (_) { /* aba anônima sem storage: segue e recarrega */ }

          var limpar = []
          if (navigator.serviceWorker) {
            limpar.push(
              navigator.serviceWorker.getRegistrations()
                .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) })
                .catch(function () {})
            )
          }
          if (window.caches) {
            limpar.push(
              caches.keys()
                .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) })
                .catch(function () {})
            )
          }
          Promise.all(limpar).then(function () { location.reload() })
        }, true)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
