<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Preview — Logo Venda Mais Premium</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0118;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      padding: 60px 24px;
    }
    label {
      color: #7C3AED;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: block;
    }
    section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; justify-content: center; }

    /* Cartão de fundo escuro */
    .card-dark {
      background: #100826;
      border: 1px solid rgba(124,58,237,0.2);
      border-radius: 24px;
      padding: 48px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    /* Cartão de fundo claro */
    .card-light {
      background: #f9f7ff;
      border: 1px solid rgba(124,58,237,0.12);
      border-radius: 24px;
      padding: 48px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    h2 { color: #e9d5ff; font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
    h2.light { color: #5B21B6; }

    .sizes { display: flex; gap: 24px; align-items: flex-end; }

    /* Divisor */
    .divider { width: 100%; max-width: 560px; height: 1px; background: linear-gradient(90deg, transparent, #7C3AED44, transparent); }
  </style>
</head>
<body>

  <!-- ÍCONE DARK -->
  <section>
    <label>Ícone do App — fundo escuro (Play Store / App Store)</label>
    <div class="card-dark">
      <div class="sizes">
        <img src="logo-chiclete.svg" width="180" height="180">
        <img src="logo-chiclete.svg" width="100" height="100">
        <img src="logo-chiclete.svg" width="60"  height="60">
        <img src="logo-chiclete.svg" width="36"  height="36">
        <img src="logo-chiclete.svg" width="20"  height="20">
      </div>
    </div>
  </section>

  <!-- ÍCONE LIGHT -->
  <section>
    <label>Ícone do App — fundo claro</label>
    <div class="card-light">
      <div class="sizes">
        <img src="logo-chiclete.svg" width="180" height="180">
        <img src="logo-chiclete.svg" width="100" height="100">
        <img src="logo-chiclete.svg" width="60"  height="60">
        <img src="logo-chiclete.svg" width="36"  height="36">
      </div>
    </div>
  </section>

  <!-- LOGO COMPLETO DARK -->
  <section>
    <label>Logo Completo — fundo escuro</label>
    <div class="card-dark">
      <img src="logo-chiclete-full.svg" width="480" height="86">
      <img src="logo-chiclete-full.svg" width="280" height="50">
      <img src="logo-chiclete-full.svg" width="180" height="32">
    </div>
  </section>

  <!-- LOGO COMPLETO LIGHT -->
  <section>
    <label>Logo Completo — fundo claro</label>
    <div class="card-light">
      <img src="logo-chiclete-full.svg" width="480" height="86">
      <img src="logo-chiclete-full.svg" width="280" height="50">
    </div>
  </section>

</body>
</html>
